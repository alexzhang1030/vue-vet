[package]
name = "vue_vet_reactivity"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Static Vue reactivity dependency tracing for Vue Vet"
documentation = "https://docs.rs/vue_vet_reactivity"
homepage = "https://github.com/alexzhang1030/vue-vet"
keywords = ["vue", "reactivity", "static-analysis", "oxc", "lint"]
categories = ["development-tools"]
exclude = ["/fixtures", "/oracle"]

[lints]
workspace = true

[dependencies]
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_parser.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
rayon.workspace = true
serde.workspace = true
thiserror.workspace = true
vue_vet_core = { version = "0.1.0", path = "../vue_vet_core" }

[dev-dependencies]
divan.workspace = true
serde_json.workspace = true

[[bench]]
name = "module_scaling"
harness = false
