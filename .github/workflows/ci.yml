name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Rust lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt
      - uses: extractions/setup-just@v3
      - run: just lint-rust

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: extractions/setup-just@v3
      - run: just test

  npm:
    name: npm launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: extractions/setup-just@v3
      - run: just npm-test

  compat:
    name: Compatibility matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: extractions/setup-just@v3
      - name: Pinned analysis stack vs compat-matrix.json
        run: just compat-matrix
      - name: Quality corpus integrity and precision
        run: just quality-gates

  oracle-self-trigger:
    name: Vue self-trigger run counts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: extractions/setup-just@v3
      - name: Watch*Effect / watch / computed run-count evidence
        run: just oracle-self-trigger
      - name: Watcher cleanup and effectScope lifetime evidence
        run: just oracle-lifetime
      - name: Source-contract runtime premises
        run: just oracle-source-contracts
      - name: Lost-notification Vue 3.5.40 premises
        run: just oracle-lost-notification
      - name: EventTarget watch cleanup identity
        run: just oracle-cleanup-identity
      - name: customRef notification-chain Vue 3.5.40 premises
        run: just oracle-custom-ref-notification
      - name: Cached-result demand VueUse premises
        run: just oracle-cached-result
      - name: Stable computed-identity Vue 3.5.40 premises
        run: just oracle-computed-identity
      - name: Derivation-practice Vue 3.5.40 / VueUse premises
        run: just oracle-derivation-practice
      - name: Scheduling-practice Vue 3.5.40 / VueUse 13.9.0 premises
        run: just oracle-scheduling-practice
      - name: Until timeout unmatched-demand VueUse premises
        run: just oracle-until-demand
      - name: Same-instance injection demand Vue 3.5.40 premises
        run: just oracle-injection-demand
      - name: VueUse demand runtime premises
        run: just oracle-vueuse-demand
      - name: Cancelled-filter promise demand VueUse premises
        run: just oracle-filter-settlement
      - name: Snapshot-demand VueUse runtime premises
        run: just oracle-snapshot-demand
      - name: Model-default demand compiled-SFC premises
        run: just oracle-model-demand
      - name: Template-ref demand Vue 3.5.40 premises
        run: just oracle-template-ref-demand

  vapor-migration-research:
    name: Vapor migration research
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: extractions/setup-just@v3
      - name: Vapor migration research oracles
        run: just vapor-migration-research
