# One-shot / recovery publish for the thin npm launcher when platform packages
# already exist on the registry (e.g. after a partial Release run).
name: Publish npm launcher

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Launcher version to sync into package.json'
        type: string
        required: true
        default: '0.1.0'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync launcher version only
        # Do not rewrite optionalDependencies — platform packages may still be
        # on an older patch (e.g. cli@0.1.1 depending on darwin-arm64@0.1.0).
        run: |
          node -e '
            const fs = require("fs");
            const path = "npm/vue-vet/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
            console.log("synced " + pkg.name + "@" + pkg.version);
          ' "${{ inputs.version }}"

      - name: Publish @vue-vet/cli launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance ./npm/vue-vet
