[workspace]
members = [
  "crates/vue_vet_cli",
  "crates/vue_vet_cache",
  "crates/vue_vet_config",
  "crates/vue_vet_core",
  "crates/vue_vet_lsp",
  "crates/vue_vet_mcp",
  "crates/vue_vet_oxc",
  "crates/vue_vet_practice",
  "crates/vue_vet_project",
  "crates/vue_vet_reactivity",
  "crates/vue_vet_reporters",
  "crates/vue_vet_rules",
  "crates/vue_vet_session",
  "crates/vue_vet_vize",
]
resolver = "3"

[workspace.package]
version = "0.1.13"
edition = "2024"
license = "MIT"
repository = "https://github.com/alexzhang1030/vue-vet"
rust-version = "1.97"
readme = "README.md"
keywords = ["vue", "nuxt", "lint", "static-analysis"]
categories = ["development-tools"]

[workspace.dependencies]
atomic-write-file = "=0.3.0"
clap = { version = "4.5", features = ["derive"] }
divan = { package = "codspeed-divan-compat", version = "=5.0.1" }
globset = "0.4"
ignore = "0.4"
oxc_allocator = "=0.127.0"
oxc_ast = "=0.127.0"
oxc_ast_visit = "=0.127.0"
oxc_parser = "=0.127.0"
# 11.22+ pulls dashmap 6.2.1; Vize pins dashmap =6.1.0. Stay on 11.21 until Vize moves.
oxc_resolver = { version = "=11.21.0", features = ["yarn_pnp"] }
oxc_semantic = "=0.127.0"
oxc_span = "=0.127.0"
oxc_syntax = "=0.127.0"
rayon = "1.10"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "std", "macros", "underline-color", "layout-cache"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tower-lsp = "0.20"
vize_atelier_sfc = "=0.291.0"
vize_atelier_core = "=0.291.0"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Vize and the cross-platform atomic writer currently bring parallel transitive
# dependency versions. Vue Vet cannot unify them without replacing or patching
# those boundary dependencies; each new duplicate still requires explicit review.
multiple_crate_versions = "allow"

# Restriction lints intentionally selected by Rolldown. Enabling the entire
# restriction group would produce contradictory and impractical requirements.
allow_attributes = "deny"
assertions_on_result_states = "deny"
as_underscore = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
deref_by_slicing = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
expect_used = "deny"
exit = "deny"
filetype_is_file = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
large_include_file = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
mixed_read_write_in_expression = "deny"
panic = "deny"
panic_in_result_fn = "deny"
pathbuf_init_then_push = "deny"
precedence_bits = "deny"
print_stderr = "deny"
print_stdout = "deny"
pub_without_shorthand = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
self_named_module_files = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
todo = "deny"
unimplemented = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnecessary_self_imports = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
unused_result_ok = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# CodSpeed instrumentation and Oxc's generated code do not link reliably under
# thin LTO. Keep release artifacts unchanged and isolate that constraint here.
[profile.codspeed]
inherits = "release"
lto = false
